fondeados y la cadena del ancla está trabajando perpendicular a la superficie del mar se dice que está:","options":["A la pendura","Clara y libre","A pique","Que ha zarpado"],"answer":2,"explanation":"A pique significa que la cadena trabaja verticalmente desde la proa hacia el fondo.","verified":"Revisión técnica del temario (no cotejada con plantilla oficial)","temario":"UT 1 · 1.3.3 A pique","pagina_apuntes":10,"referencia":"Apuntes PER.pdf · UT 1 · 1.3.3 A pique · página 10 del PDF","nota_temario":""},{"id":"2025-2-3","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":3,"unit":1,"question":"En una embarcación con dos hélices gemelas de giro al exterior, la hélice de estribor es:","options":["Levógira","Dextrógira","Ambas son iguales","Depende del sentido de marcha"],"answer":1,"explanation":"En hélices gemelas de giro exterior, la de estribor es dextrógira en marcha avante.","verified":"Revisión técnica del temario (no cotejada con plantilla oficial)","temario":"UT 1 · 1.5.3 Hélices gemelas","pagina_apuntes":12,"referencia":"Apuntes PER.pdf · UT 1 · 1.5.3 Hélices gemelas · página 12 del PDF","nota_temario":""},{"id":"2025-2-4","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":4,"unit":1,"question":"La parte superior del costado de una embarcación comprendida entre la cubierta y el comienzo de la regala se denomina:","options":["Trancanil","Francobordo","Pasamanos","Borda UNIDAD TEÓRICA 2. ELEMENTOS DE AMARRE Y FONDEO"],"answer":3,"explanation":"La borda es la prolongación superior del costado hasta la regala.","verified":"Revisión técnica del temario (no cotejada con plantilla oficial)","temario":"UT 1 · 1.2.1 Borda","pagina_apuntes":7,"referencia":"Apuntes PER.pdf · UT 1 · 1.2.1 Borda · página 7 del PDF","nota_temario":""},{"id":"2025-2-5","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":5,"unit":2,"question":"El extremo libre de un cabo o cable se denomina:","options":["Seno","Chicote","Firme","Gaza"],"answer":1,"explanation":"El chicote es el extremo libre de un cabo; el firme es la parte sujeta.","verified":"Revisión técnica del temario (no cotejada con plantilla oficial)","temario":"UT 2 · 2.1.1 Chicote y firme","pagina_apuntes":15,"referencia":"Apuntes PER.pdf · UT 2 · 2.1.1 Chicote y firme · página 15 del PDF","nota_temario":""},{"id":"2025-2-6","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":6,"unit":2,"question":"La acción que se produce cuando el ancla no se agarra en el fondo y se arrastra por él se llama:","options":["Zarpar","Orincar","Garreo","Borneo UNIDAD TEÓRICA 3. SEGURIDAD EN LA MAR"],"answer":2,"explanation":"Garrear significa que el ancla se arrastra por el fondo sin sujetar la embarcación.","verified":"Revisión técnica del temario (no cotejada con plantilla oficial)","temario":"UT 2 · 2.3.3 Garreo","pagina_apuntes":17,"referencia":"Apuntes PER.pdf · UT 2 · 2.3.3 Garreo · página 17 del PDF","nota_temario":""},{"id":"2025-2-7","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":7,"unit":3,"question":"¿Cuál de las siguientes afirmaciones sobre las tormentas eléctricas es correcta?:","options":["Afectan a los equipos eléctricos únicamente cuando la embarcación tiene el casco metálico","Solo afectan a embarcaciones de pequeño calado y casco de madera","Pueden provocar perturbaciones magnéticas que modifiquen los desvíos de la aguja náutica de forma temporal o permanente","No representan ningún riesgo si se navega con el motor parado"],"answer":2,"explanation":"Las perturbaciones electromagnéticas pueden alterar el comportamiento de la aguja magnética.","verified":"Revisión técnica del temario (no cotejada con plantilla oficial)","temario":"UT 3 · 3.4 Tormentas eléctricas","pagina_apuntes":23,"referencia":"Apuntes PER.pdf · UT 3 · 3.4 Tormentas eléctricas · página 23 del PDF","nota_temario":"Apuntes elaborados en enero de 2015; verificar posibles modificaciones normativas posteriores."},{"id":"2025-2-8","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":8,"unit":3,"question":"En caso de caída de un tripulante al agua, ¿qué función debe activarse inmediatamente del sistema de navegación por satélite (GNSS)?:","options":["La función VHF para transmitir la posición de la embarcación en todo momento","La función MOB para marcar la posición exacta del incidente y facilitar las maniobras de búsqueda","Piloto automático en modo retorno para aproximarse al náufrago","La función rumbo directo al utilizar el GNSS se activa de manera automática"],"answer":1,"explanation":"La función MOB registra la posición del hombre al agua para facilitar el regreso y la búsqueda.","verified":"Revisión técnica del temario (no cotejada con plantilla oficial)","temario":"UT 3 · 3.8.5 Función MOB","pagina_apuntes":28,"referencia":"Apuntes PER.pdf · UT 3 · 3.8.5 Función MOB · página 28 del PDF","nota_temario":"Apuntes elaborados en enero de 2015; verificar posibles modificaciones normativas posteriores."},{"id":"2025-2-9","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":9,"unit":3,"question":"En condiciones de baja visibilidad, ¿cuál de las siguientes acciones es la más adecuada para incrementar la seguridad de nuestra navegación?:","options":["Reducir la velocidad y aumentar la vigilancia visual y auditiva","Navegar en las zonas con mayor densidad del tráfico","Encender las luces interiores de la embarcación para ser detectados","Incrementar la velocidad para atravesar rápidamente la zona de baja visibilidad"],"answer":0,"explanation":"La vigilancia visual y auditiva y la velocidad de seguridad son esenciales con visibilidad reducida; RIPA reglas 5, 6 y 19.","verified":"Revisión técnica del temario (no cotejada con plantilla oficial)","temario":"UT 3 · 3.5 Baja visibilidad","pagina_apuntes":23,"referencia":"Apuntes PER.pdf · UT 3 · 3.5 Baja visibilidad · página 23 del PDF","nota_temario":"Apuntes elaborados en enero de 2015; verificar posibles modificaciones normativas posteriores."},{"id":"2025-2-10","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":10,"unit":3,"question":"Al navegar en aguas someras, ¿cuál de las siguientes precauciones deberíamos tomar?:","options":["Aumentar la velocidad de forma progresiva hasta la máxima velocidad","Consultar la sonda y reducir velocidad para evitar varadas","Desactivar el piloto automático para mantener un rumbo más exacto","Planificar una derrota que permita mantener un rumbo con el viento por la popa UNIDAD TEÓRICA 4. LEGISLACIÓN"],"answer":1,"explanation":"La sonda permite controlar la profundidad disponible; moderar la velocidad reduce el riesgo de varada.","verified":"Revisión técnica del temario (no cotejada con plantilla oficial)","temario":"UT 3 · 3.6 Aguas someras","pagina_apuntes":24,"referencia":"Apuntes PER.pdf · UT 3 · 3.6 Aguas someras · página 24 del PDF","nota_temario":"Apuntes elaborados en enero de 2015; verificar posibles modificaciones normativas posteriores."},{"id":"2025-2-11","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":11,"unit":4,"question":"En relación al uso de la bandera de la comunidad autónoma, indique qué respuesta es correcta:","options":["Se podrá izar junto con la bandera de España, debajo de ésta, y su tamaño será igual que el del Pabellón nacional","Se reservará el asta de popa para la bandera de la comunidad autónoma si se decide enarbolar ésta y si la bandera de España está izada en otro lugar","No se podrá izar si no lo está el Pabellón nacional y sus dimensiones nunca serán superiores a un tercio del área de la bandera de España","Ninguna de las respuestas anteriores es correcta"],"answer":null},{"id":"2025-2-12","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":12,"unit":4,"question":"¿Quién será el responsable de las infracciones por contaminación del medio marino producidas desde una embarcación?:","options":["El causante de la contaminación, aunque sólo sea un tripulante, solidariamente con el patrón de la embarcación","Únicamente el asegurador de la responsabilidad civil","Únicamente el patrón de la embarcación","Serán solidariamente responsables el naviero, el propietario, el asegurador de la responsabilidad civil y el patrón de la embarcación UNIDAD TEÓRICA 5. BALIZAMIENTO (De acuerdo con el apartado 5.1 del temario de conocimientos teóricos en vigor, las preguntas sobre marcas laterales se refieren a la Región de Balizamiento A)"],"answer":null},{"id":"2025-2-13","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":13,"unit":5,"question":"Las marcas laterales de babor son de color:","options":["Verde","Rojo","Amarillo","Azul"],"answer":1,"explanation":"En la región A del sistema IALA, las marcas laterales de babor son rojas al entrar desde la mar.","verified":"Revisión técnica del temario (no cotejada con plantilla oficial)","temario":"UT 5 · 5.1 Marcas laterales Región A","pagina_apuntes":43,"referencia":"Apuntes PER.pdf · UT 5 · 5.1 Marcas laterales Región A · página 43 del PDF","nota_temario":""},{"id":"2025-2-14","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":14,"unit":5,"question":"Las marcas cardinales tienen por objeto indicar al navegante:","options":["Los límites de un puerto","La localización de las aguas seguras","Las zonas de fondeo","Los canales principales"],"answer":null},{"id":"2025-2-15","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":15,"unit":5,"question":"De noche, las marcas de peligro aislado emiten luz blanca con un ritmo de:","options":["Centelleante rápido continuo","Grupos de dos destellos","Grupos de tres destellos","Isofase"],"answer":1,"explanation":"Una marca de peligro aislado puede emitir luz blanca en grupos de dos destellos, Fl(2).","verified":"Revisión técnica del temario (no cotejada con plantilla oficial)","temario":"UT 5 · Marcas de peligro aislado","pagina_apuntes":45,"referencia":"Apuntes PER.pdf · UT 5 · Marcas de peligro aislado · página 45 del PDF","nota_temario":""},{"id":"2025-2-16","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":16,"unit":5,"question":"Las marcas de canal principal que señalan una bifurcación emiten luz con ritmo de:","options":["Centelleante rápido continuo","Grupos de (2+1) destellos","Grupos de dos destellos","Isofase"],"answer":1,"explanation":"Las marcas laterales modificadas de canal preferente utilizan grupos de dos más un destello, Fl(2+1).","verified":"Revisión técnica del temario (no cotejada con plantilla oficial)","temario":"UT 5 · Marcas de bifurcación","pagina_apuntes":44,"referencia":"Apuntes PER.pdf · UT 5 · Marcas de bifurcación · página 44 del PDF","nota_temario":""},{"id":"2025-2-17","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":17,"unit":5,"question":"Las marcas especiales son de color:","options":["Rojo","Verde","Amarillo","Blanco UNIDAD TEÓRICA 6. REGLAMENTO DE ABORDAJES"],"answer":2,"explanation":"Las marcas especiales del sistema IALA son amarillas.","verified":"Revisión técnica del temario (no cotejada con plantilla oficial)","temario":"UT 5 · Marcas especiales","pagina_apuntes":46,"referencia":"Apuntes PER.pdf · UT 5 · Marcas especiales · página 46 del PDF","nota_temario":""},{"id":"2025-2-18","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":18,"unit":6,"question":"¿Cuándo se navega en condiciones de «visibilidad reducida»?:","options":["Cuando la visibilidad está disminuida por niebla, bruma, nieve, fuertes aguaceros, tormentas de arena o cualesquiera otras causas análogas","Cuando se navega de noche","Cuando los buques están tan lejanos que no se encuentran a la vista el uno del otro","Las respuestas a) y b) son correctas"],"answer":0,"explanation":"El RIPA, regla 3, define visibilidad reducida por niebla, bruma, nieve, fuertes aguaceros y causas análogas.","verified":"Revisión técnica del temario (no cotejada con plantilla oficial)","temario":"UT 6 · Regla 3, definiciones","pagina_apuntes":50,"referencia":"Apuntes PER.pdf · UT 6 · Regla 3, definiciones · página 50 del PDF","nota_temario":"Apuntes elaborados en enero de 2015; verificar posibles modificaciones normativas posteriores."},{"id":"2025-2-19","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":19,"unit":6,"question":"¿Qué equipo de señales acústicas debe llevar un buque de vela de 11 m de eslora?:","options":["Un pito y una campana","Un pito","Cualquier medio capaz de hacer señales acústicas eficaces","Ninguna de las respuestas anteriores es correcta"],"answer":2,"explanation":"Según la regla 33 del RIPA, un buque de menos de 12 metros no está obligado a llevar pito ni campana, pero sí un medio eficaz de señales acústicas.","verified":"Revisión técnica del temario (no cotejada con plantilla oficial)","temario":"UT 6 · Regla 33, señales acústicas","pagina_apuntes":null,"referencia":"Apuntes PER.pdf · UT 6 · Regla 33, señales acústicas","nota_temario":"Apuntes elaborados en enero de 2015; verificar posibles modificaciones normativas posteriores."},{"id":"2025-2-20","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":20,"unit":6,"question":"Navegando en niebla, ¿debemos encender las luces de navegación?:","options":["Sí, siempre","De día no es necesario, aunque es una buena medida","No podemos, salvo que estemos entre la puesta y la salida del Sol","Depende de la claridad que haya"],"answer":0,"explanation":"La regla 20 del RIPA exige exhibir las luces prescritas también durante el día en visibilidad reducida.","verified":"Revisión técnica del temario (no cotejada con plantilla oficial)","temario":"UT 6 · Regla 20, luces","pagina_apuntes":null,"referencia":"Apuntes PER.pdf · UT 6 · Regla 20, luces","nota_temario":"Apuntes elaborados en enero de 2015; verificar posibles modificaciones normativas posteriores."},{"id":"2025-2-21","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":21,"unit":6,"question":"En una situación de cruce con riesgo de abordaje entre dos buques de propulsión mecánica a la vista el uno del otro, el que tiene al otro por el costado de estribor:","options":["Se mantendrá apartado de la derrota del otro","Mantendrá rumbo y velocidad","Coordinará la maniobra a realizar por VHF","Emitirá cinco o más pitadas cortas y rápidas"],"answer":0,"explanation":"En cruce de dos buques de propulsión mecánica, el que ve al otro por estribor debe apartarse; regla 15 del RIPA.","verified":"Revisión técnica del temario (no cotejada con plantilla oficial)","temario":"UT 6 · Regla 15, cruce","pagina_apuntes":null,"referencia":"Apuntes PER.pdf · UT 6 · Regla 15, cruce","nota_temario":"Apuntes elaborados en enero de 2015; verificar posibles modificaciones normativas posteriores."},{"id":"2025-2-22","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":22,"unit":6,"question":"En un dispositivo de separación del tráfico, los buques de eslora inferior a 20 metros:","options":["Podrán navegar tanto por las vías de circulación como por las zonas de navegación costera adyacentes","No podrán navegar por las vías de circulación del dispositivo, salvo para evitar un peligro inminente","No podrán utilizar las zonas de navegación costera adyacentes, salvo que vayan o vengan de algún punto situado dentro de ellas","Sólo podrán utilizar el dispositivo entre la salida y la puesta del sol"],"answer":null},{"id":"2025-2-23","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":23,"unit":6,"question":"Cuando el buque que «cede el paso» maniobra para evitar un abordaje:","options":["Es recomendable que realice cambios de rumbo pequeños para no desviarse mucho de su derrota, siempre que haya espacio suficiente","Esperará a maniobrar hasta tener la seguridad de que el abordaje es inminente","Si las circunstancias lo permiten, efectuará cambios de rumbo y/o velocidad lo suficientemente amplios para ser percibidos desde el otro buque","Las respuestas a) y c) son correctas"],"answer":2,"explanation":"La regla 8 del RIPA exige maniobras amplias, claras y realizadas con suficiente antelación.","verified":"Revisión técnica del temario (no cotejada con plantilla oficial)","temario":"UT 6 · Regla 8, maniobra de abordaje","pagina_apuntes":55,"referencia":"Apuntes PER.pdf · UT 6 · Regla 8, maniobra de abordaje · página 55 del PDF","nota_temario":"Apuntes elaborados en enero de 2015; verificar posibles modificaciones normativas posteriores."},{"id":"2025-2-24","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":24,"unit":6,"question":"¿A qué categoría pertenece un buque que, debido a la naturaleza de su trabajo, tiene reducida su capacidad para maniobrar de la forma exigida por el Reglamento de Abordajes y, por consiguiente, no puede apartarse de la derrota de otro buque?:","options":["Buque con capacidad de maniobra restringida","Buque sin gobierno","Buque dedicado a la pesca","Las respuestas a) y c) son correctas"],"answer":0,"explanation":"La regla 3 del RIPA define al buque con capacidad de maniobra restringida por la naturaleza de su trabajo.","verified":"Revisión técnica del temario (no cotejada con plantilla oficial)","temario":"UT 6 · Regla 3, buques","pagina_apuntes":50,"referencia":"Apuntes PER.pdf · UT 6 · Regla 3, buques · página 50 del PDF","nota_temario":"Apuntes elaborados en enero de 2015; verificar posibles modificaciones normativas posteriores."},{"id":"2025-2-25","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":25,"unit":6,"question":"¿Cuál de las siguientes configuraciones de luces puede exhibir de noche un buque de propulsión mecánica de 6,5 metros de eslora que navega a una velocidad de 10 nudos?:","options":["Una única luz blanca todo horizonte","Una luz blanca todo horizonte y luces de costado","Una luz blanca todo horizonte, luces de costado y luz de alcance","Todas las respuestas anteriores son correctas"],"answer":null},{"id":"2025-2-26","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":26,"unit":6,"question":"Un buque de vela está alcanzando a un buque de propulsión mecánica, con riesgo de abordaje. Si ambos buques están en mar abierto a la vista el uno del otro:","options":["El de vela se mantendrá apartado de la derrota del de propulsión mecánica","El de propulsión mecánica se mantendrá apartado de la derrota del de vela","Ambos caerán a la banda contraria de la que está el otro buque","Esta situación no la contempla el Reglamento de Abordajes"],"answer":0,"explanation":"La regla 13 del RIPA obliga al buque que alcanza a mantenerse apartado, incluso si es un velero.","verified":"Revisión técnica del temario (no cotejada con plantilla oficial)","temario":"UT 6 · Regla 13, alcance","pagina_apuntes":null,"referencia":"Apuntes PER.pdf · UT 6 · Regla 13, alcance","nota_temario":"Apuntes elaborados en enero de 2015; verificar posibles modificaciones normativas posteriores."},{"id":"2025-2-27","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":27,"unit":6,"question":"Visibilidad reducida. Salvo en los casos en que hayamos comprobado que no existe riesgo de abordaje, ¿qué debemos hacer si oímos, más o menos por la amura de babor, la señal de niebla de otro buque?","options":["Caer con toda la caña a estribor","Caer con toda la caña a babor","Emitir cinco o más pitadas cortas y rápidas","Reducir la velocidad a la mínima de gobierno UNIDAD TEÓRICA 7. MANIOBRA Y NAVEGACIÓN"],"answer":null},{"id":"2025-2-28","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":28,"unit":7,"question":"¿Qué es adujar un cabo?:","options":["Acción de apretar un cabo","Librar un cabo","Acción que consiste en dejar el cabo recogido y estibado con vueltas y claro","Acción de sujetar un cabo"],"answer":null},{"id":"2025-2-29","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":29,"unit":7,"question":"La velocidad de gobierno es:","options":["La velocidad que da el motor de un barco","La velocidad mínima a la que el barco puede gobernar","La velocidad máxima que tiene el barco con buen tiempo","La velocidad resultante de la curva de evolución UNIDAD TEÓRICA 8. EMERGENCIAS EN LA MAR"],"answer":null},{"id":"2025-2-30","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":30,"unit":8,"question":"Los fuegos de la clase «A» son:","options":["Fuegos de gases combustibles que, en condiciones normales de presión y temperatura, se encuentran en estado gaseoso","Fuegos de metales combustibles, entre otros magnesio y potasio","Fuegos derivados de aceites y grasas vegetales o animales en materiales y aparatos de cocina","Fuegos de combustibles sólidos que producen brasas, entre otros madera, papel, tela o plásticos"],"answer":null},{"id":"2025-2-31","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":31,"unit":8,"question":"Tras sufrir un abordaje, ¿cuál de las siguientes actuaciones es prioritaria?:","options":["Separar inmediatamente ambas embarcaciones, sin necesidad de comprobar el tipo o la localización de los daños","Evaluar posibles vías de agua o daños estructurales, especialmente por debajo de la línea de flotación","Avisar a Salvamento Marítimo únicamente si se detectan daños visibles por encima de la cubierta","Detener el motor y todos los medios de achique en funcionamiento"],"answer":null},{"id":"2025-2-32","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":32,"unit":8,"question":"De las siguientes medidas a tomar antes de abandonar la embarcación, señale cuál es correcta:","options":["Incrementar la velocidad de la embarcación para facilitar el abandono","Emitir llamada/mensaje de socorro y activar la radiobaliza manualmente (si se tiene disponible)","Retirar toda ropa de abrigo y el chaleco salvavidas para facilitar el posterior rescate","Abandonar la embarcación sin valorar si es imprescindible UNIDAD TEÓRICA 9. METEOROLOGÍA"],"answer":null},{"id":"2025-2-33","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":33,"unit":9,"question":"De las siguientes afirmaciones, marque la correcta:","options":["El valor normal de la presión atmosférica a nivel del mar es aproximadamente de 760 hPa","Las isobaras son líneas que unen puntos de igual temperatura indicando cuando se encuentran muy próximas entre sí que la intensidad del viento es muy baja","Los barómetros aneroides equilibran la presión por fuerzas elásticas","El barómetro aneroide contiene una cápsula de mercurio que se expande o contrae con los cambios de presión"],"answer":null},{"id":"2025-2-34","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":34,"unit":9,"question":"De las siguientes afirmaciones marque la opción FALSA.","options":["La Escala de Beaufort es universalmente utilizada para indicar la graduación de la intensidad y la fuerza correspondiente del viento, normalmente en nudos","El anemómetro es el aparato que sirve para medir la velocidad del viento","El catavientos es un aparato que sirve para indicar la dirección del viento","La escala Douglas se refiere al estado de la mar, con una graduación que está en función de la velocidad de las olas"],"answer":null},{"id":"2025-2-35","year":2025,"conv":2,"date":"5 de julio de 2025","model":"A","number":35,"unit":9,"question":"En relación a los anticiclones y las borrascas en el hemisferio norte marque, la opción correcta.","options":["Un anticiclón es una zona de bajas presiones donde el viento gira en sentido antihorario, generalmente asociado a tiempo inestable y precipitaciones","Las borrascas son centros de alta presión con vientos que giran en sentido horario, y tienden a desplazarse predominantemente de Este a Oeste","En una borrasca, el viento gira en sentido antihorario, la presión disminuye hacia el centro trayendo consigo tiempo inestable","Un anticiclón se caracteriza por una baja presión en su centro, vientos fuertes que giran en sentido antihorario y una trayectoria errática"],"answer":null},{"id":"2025-2-36","year":  PER.pdf · UT 5 · Marcas de bifurcación · página 44 del PDF","nota_temario":""},{"id":"2026-1-17","year":2026,"conv":1,"date":"21 de marzo de 2026","model":"A","number":17,"unit":5,"question":"¿Cuál es el ritmo de la luz de una marca cardinal Sur?:","options":["Grupos de nueve centelleos rápidos CtRp(9)/VQ(9) cada 10 s o grupos de nueve centelleos Ct(9)/Q(9) cada 15 s","Grupos de tres centelleos rápidos CtRp(3)/VQ(3) cada 5 s o grupos de tres centelleos Ct(3)/Q(3) cada 10 s","Grupo de 6 centelleos rápidos CtRp(6)/VQ(6) más un destello largo cada 10 s o grupo de 6 centelleos Ct(6)/Q(6) más un destello largo cada 15 s","Grupo de dos destellos Fl(2) UNIDAD TEÓRICA 6. REGLAMENTO DE ABORDAJES"],"answer":2,"explanation":"La cardinal Sur emite seis centelleos más un destello largo blanco.","verified":"Revisión técnica del temario (no cotejada con plantilla oficial)","temario":"UT 5 · Marcas cardinales","pagina_apuntes":44,"referencia":"Apuntes PER.pdf · UT 5 · Marcas cardinales · página 44 del PDF","nota_temario":""},{"id":"2026-1-18","year":2026,"conv":1,"date":"21 de marzo de 2026","model":"A","number":18,"unit":6,"question":"Navegando a motor de noche observamos por estribor, en marcación 103º, las dos luces de tope y la luz de costado roja de un buque que se aproxima con riesgo de abordaje. Nos encontramos en:","options":["Una situación de alcance en la que somos el buque que «sigue rumbo». En principio debemos mantener nuestro rumbo y velocidad","Una situación de cruce en la que somos el buque que «sigue rumbo». En principio debemos mantener nuestro rumbo y velocidad","Una situación de alcance en la que somos el buque que «cede el paso». Debemos mantenernos apartados de la derrota del otro buque","Una situación de cruce en la que somos el buque que «cede el paso». Debemos mantenernos apartados de la derrota del otro buque"],"answer":null},{"id":"2026-1-19","year":2026,"conv":1,"date":"21 de marzo de 2026","model":"A","number":19,"unit":6,"question":"Dos buques de vela
